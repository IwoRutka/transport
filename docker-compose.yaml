version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    networks:
      - transport-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - transport-network

  database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --wait_timeout=28800
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transport
      MYSQL_USER: iwor
      MYSQL_PASSWORD: Do197863
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transport-network

volumes:
  db-data:

networks:
  transport-network:
    driver: bridge
